# Supabase free-plan projects pause after ~7 days without activity, which would break the
# coming-soon forms. This pings a harmless database function twice a week to keep it awake.
# Remove once the project is on a paid plan.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 * * 1,4"   # Mondays and Thursdays, 14:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error -X POST \
            "https://zyygkgaciehejipexigh.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_FBf9ePys3eaW2TBhMH_eWg_SomMw29a" \
            -H "Content-Type: application/json" \
            -d '{}'
